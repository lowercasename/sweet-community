# Runs the tests, then builds and publishes the image. Every push to main publishes
# ghcr.io/lowercasename/sweet-community:latest and :sha-<commit>. A tag v* also publishes :<version>.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck && pnpm check:atomic && pnpm format:check && pnpm test
        working-directory: web
      # The binary embeds the frontend build and a copy of migrations/, so both exist before Go runs.
      - run: pnpm build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cmd/sweet/migrations && go vet ./... && go test ./...
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Check sign-in and privacy in the browser
        run: pnpm e2e:release
        working-directory: web
        timeout-minutes: 10
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags, for git describe.
          fetch-depth: 0
      - id: version
        # The release the image is built from: the tag, such as v1.2.3, or v1.2.3-4-gab1c234 for a commit after it.
        run: echo "release=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            # The major version, such as 1. It moves to each new 1.x release, so a server that pins it updates within
            # 1.x and never jumps to 2.0, which needs the person running Sweet to act.
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
