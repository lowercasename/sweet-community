# Sweet with Caddy in front of it. See the README.
name: sweet

services:
  sweet:
    image: ${SWEET_IMAGE:-ghcr.io/lowercasename/sweet-community:latest}
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      SWEET_BASE_URL: https://${SWEET_DOMAIN}
      SWEET_TRUST_PROXY: "${SWEET_TRUST_PROXY:-1}"
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - sweet
    environment:
      SWEET_DOMAIN: ${SWEET_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # Litestream needs a local disk, not a network filesystem.
  data:
  caddy-data:
  caddy-config:
