# Sweet with its own Caddy: certificates, HTTPS and the proxying are
# handled for you. Copy env.example to .env, fill it in, `docker compose up -d`.
# Already running a reverse proxy on this host? Use compose.proxied.yml.
name: sweet

services:
  sweet:
    build: ..
    image: sweet
    restart: unless-stopped
    env_file: .env
    environment:
      SWEET_BASE_URL: https://${SWEET_DOMAIN}
      SWEET_TRUST_PROXY: "1"
      SWEET_DATA: /data
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - sweet
    environment:
      SWEET_DOMAIN: ${SWEET_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  # Local disk, as Litestream requires; never a network filesystem.
  data:
  caddy-data:
  caddy-config:
