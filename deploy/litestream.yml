# Litestream replicates the database to the bucket. The entrypoint sets these variables.
dbs:
  - path: ${SWEET_DATA}/sweet.db
    replica:
      type: s3
      bucket: ${SWEET_S3_BUCKET}
      path: db
      endpoint: ${SWEET_S3_URL}
      region: ${SWEET_S3_REGION}
      access-key-id: ${SWEET_S3_ACCESS_KEY}
      secret-access-key: ${SWEET_S3_SECRET_KEY}
